name: stock_checker

on:
  schedule:
    # Hourly at :47, Mon-Fri, 14:47-21:47 UTC. Always after the US market open and
    # catches the close: 6:47 AM-1:45 PM PST (winter), 7:47 AM-2:47 PM PDT (summer).
    - cron: "47 14-21 * * 1-5"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock_checker
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stock_checker/requirements.txt

      - run: pip install -r requirements.txt

      # Remember which alerts were already sent today
      - uses: actions/cache@v5
        with:
          path: stock_checker/.state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - run: python stock_checker.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
