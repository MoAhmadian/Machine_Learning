name: stock_checker

on:
  schedule:
    # Every 20 minutes (:07, :27, :47), Mon-Fri, 12:00-20:59 UTC.
    # Alert window is 5:00 AM-12:47 PM Pacific (enforced in the script). Slots start at
    # 5:07 AM PT (summer) / 4:07 AM PT (winter; that first hour just exits). GitHub drops
    # and delays scheduled runs, so extra slots raise the odds some arrive on time. The
    # once-per-day de-duplication state prevents repeat emails.
    - cron: "7,27,47 12-20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: stock_checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock_checker
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stock_checker/requirements.txt

      - run: pip install -r requirements.txt

      # Remember which alerts were already sent today
      - uses: actions/cache@v5
        with:
          path: stock_checker/.state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - run: python stock_checker.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
