name: stock_checker

on:
  schedule:
    # Hourly, Mon-Fri, 14:00-21:00 UTC (covers US market hours in EST and EDT)
    - cron: "0 14-21 * * 1-5"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock_checker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stock_checker/requirements.txt

      - run: pip install -r requirements.txt

      # Remember which alerts were already sent today
      - uses: actions/cache@v4
        with:
          path: stock_checker/.state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - run: python stock_checker.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
